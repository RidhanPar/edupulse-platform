{% extends 'base.html' %}
{% block content %}
<div class="card">
  <p>{{ message }}</p>
  <div class="hero-actions">
    {% if current_user.is_authenticated %}
    <a class="btn btn-secondary" href="{{ url_for('home') }}">Back to Home</a>
    {% else %}
    <a class="btn btn-secondary" href="{{ url_for('auth.login') }}">Go to log in</a>
    {% endif %}
  </div>
</div>
{% endblock %}
